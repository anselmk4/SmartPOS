<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="192" height="192">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    
    <!-- Butterfly Blue Gradient -->
    <linearGradient id="butterflyBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a4fb4" />
      <stop offset="50%" stop-color="#0e5cdb" />
      <stop offset="100%" stop-color="#186ef2" />
    </linearGradient>

    <!-- Ambient Shadow -->
    <filter id="glowShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0e5cdb" flood-opacity="0.28" />
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0a4fb4" flood-opacity="0.2" />
    </filter>
  </defs>

  <!-- Clean Rounded Base Frame -->
  <rect width="512" height="512" rx="128" fill="url(#bgGradient)" stroke="#e2e8f0" stroke-width="4" />

  <!-- Iconic Blue Butterfly Logo -->
  <g filter="url(#glowShadow)" fill="url(#butterflyBlue)" transform="translate(40, 40) scale(0.84)">
    <!-- Antennae -->
    <!-- Left Antenna -->
    <path d="M236 175 C 220 120, 190 90, 168 76" stroke="url(#butterflyBlue)" stroke-width="8" stroke-linecap="round" fill="none" />
    <circle cx="165" cy="74" r="7" fill="url(#butterflyBlue)" />

    <!-- Right Antenna -->
    <path d="M276 175 C 292 120, 322 90, 344 76" stroke="url(#butterflyBlue)" stroke-width="8" stroke-linecap="round" fill="none" />
    <circle cx="347" cy="74" r="7" fill="url(#butterflyBlue)" />

    <!-- Butterfly Wings & Body Solid Silhouette -->
    <path d="
      M 256 182
      C 246 160, 218 105, 142 82
      C 72 60, 38 106, 52 178
      C 62 230, 114 260, 162 278
      C 134 296, 78 340, 88 410
      C 98 478, 168 496, 214 430
      C 236 398, 246 360, 252 320
      C 254 310, 258 310, 260 320
      C 266 360, 276 398, 298 430
      C 344 496, 414 478, 424 410
      C 434 340, 378 296, 350 278
      C 398 260, 450 230, 460 178
      C 474 106, 440 60, 370 82
      C 294 105, 266 160, 256 182
      Z
    " />

    <!-- Center Thorax / Body Capsule Highlight -->
    <path d="M 256 170 C 248 170, 244 210, 244 260 C 244 305, 248 340, 256 340 C 264 340, 268 305, 268 260 C 268 210, 264 170, 256 170 Z" fill="#083884" opacity="0.3" />
  </g>
</svg>
