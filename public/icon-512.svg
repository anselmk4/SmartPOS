<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background Rounded Base -->
  <rect width="512" height="512" rx="128" fill="url(#bgGradient)" />

  <!-- Inner POS Terminal & Cart Graphic -->
  <g filter="url(#dropShadow)" transform="translate(106, 106)">
    <!-- Main Store / Terminal Body -->
    <rect x="20" y="40" width="260" height="200" rx="36" fill="#ffffff" />
    <!-- Screen Header -->
    <rect x="40" y="60" width="220" height="60" rx="16" fill="#eff6ff" />
    <circle cx="70" cy="90" r="10" fill="#2563eb" />
    <rect x="95" y="82" width="130" height="16" rx="8" fill="#93c5fd" />
    
    <!-- POS Numeric / Keypad Grid -->
    <rect x="40" y="135" width="60" height="30" rx="8" fill="#f1f5f9" />
    <rect x="120" y="135" width="60" height="30" rx="8" fill="#f1f5f9" />
    <rect x="200" y="135" width="60" height="30" rx="8" fill="#22c55e" />
    
    <rect x="40" y="180" width="60" height="30" rx="8" fill="#f1f5f9" />
    <rect x="120" y="180" width="60" height="30" rx="8" fill="#f1f5f9" />
    <rect x="200" y="180" width="60" height="30" rx="8" fill="#3b82f6" />
    
    <!-- Base Stand -->
    <path d="M100 240 L200 240 L220 280 L80 280 Z" fill="#ffffff" opacity="0.9" />
    <rect x="60" y="275" width="180" height="14" rx="7" fill="#ffffff" />
  </g>
</svg>
